<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Deep Obsidian Tile -->
  <rect width="64" height="64" rx="8" fill="#08090C"/>
  <rect width="64" height="64" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Base Stone: Titanium Facet -->
  <path d="M12 45L22 39H42L52 45L40 51H24L12 45Z" fill="#181B24" stroke="rgba(255,255,255,0.14)" stroke-width="1.2"/>
  <path d="M24 51L32 46L40 51L32 53L24 51Z" fill="#11131A"/>

  <!-- Mid Stone: Basalt Balance -->
  <path d="M17 33L26 28H38L47 33L37 38H27L17 33Z" fill="#222734" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>

  <!-- Keystone: Ground Truth Emerald -->
